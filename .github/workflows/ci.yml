name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install clang and the libbpf headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev

      # Compiles the .bpf.c sources, so a change that breaks them fails here.
      - name: Generate
        run: make generate

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
