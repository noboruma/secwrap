# On a pushed version tag (v1.2.3, or v1.2.3-rc1 for a pre-release), builds
# secwrap for every Linux architecture in the Makefile's ARCHES, creates the
# GitHub release with generated notes, and attaches the binaries and their
# SHA-256 checksums. If the release already exists, only the files are
# (re)uploaded. The eBPF objects are generated once per byte order
# (internal/monitor/secwrap_bpfel.* and secwrap_bpfeb.*, committed).
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # upload release assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          mkdir -p dist
          for a in amd64 386 arm64 arm mips mipsle mips64 mips64le riscv64 ppc64le s390x loong64; do
            name="secwrap-linux-${a}"
            # static binaries, run on any Linux distribution; mips without an FPU
            CGO_ENABLED=0 GOOS=linux GOARCH="$a" GOMIPS=softfloat GOMIPS64=softfloat \
              go build -trimpath -ldflags "-s -w" -o "dist/${name}" ./cmd/secwrap
            (cd dist && sha256sum "${name}" > "${name}.sha256")
          done

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            pre=""
            case "$TAG" in *-*) pre="--prerelease" ;; esac # v1.2.3-rc1
            gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --generate-notes --verify-tag $pre
          fi
