# Builds secwrap for every Linux architecture in the Makefile's ARCHES and
# attaches the binaries (and their SHA-256 checksums) to a GitHub release
# when it is published. The eBPF objects are generated once per byte order
# (internal/monitor/secwrap_bpfel.* and secwrap_bpfeb.*, committed).
name: release

on:
  release:
    types: [published]

permissions:
  contents: write # upload release assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          mkdir -p dist
          for a in amd64 386 arm64 arm mips mipsle mips64 mips64le riscv64 ppc64le s390x loong64; do
            name="secwrap-linux-${a}"
            # static binaries, run on any Linux distribution; mips without an FPU
            CGO_ENABLED=0 GOOS=linux GOARCH="$a" GOMIPS=softfloat GOMIPS64=softfloat \
              go build -trimpath -ldflags "-s -w" -o "dist/${name}" ./cmd/secwrap
            (cd dist && sha256sum "${name}" > "${name}.sha256")
          done

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --repo "${{ github.repository }}" --clobber
