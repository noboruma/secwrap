# On a pushed version tag (v1.2.3, or v1.2.3-rc1 for a pre-release), builds
# secwrap for every Linux architecture in the Makefile's ARCHES, creates the
# GitHub release with generated notes, and attaches the binaries and their
# SHA-256 checksums (make dist). If the release already exists, only the
# files are (re)uploaded. The eBPF objects are generated here (make
# generate), once per byte order.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # upload release assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install clang and the libbpf headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev

      # The eBPF objects (internal/monitor/secwrap_bpfe[lb].*) from the
      # .bpf.c sources, so the release never ships stale ones.
      - name: Generate
        run: make generate

      - name: Test
        run: go test ./...

      - name: Build
        run: make dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            pre=""
            case "$TAG" in *-*) pre="--prerelease" ;; esac # v1.2.3-rc1
            gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --generate-notes --verify-tag $pre
          fi
